<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天砕 — TENSAI</title><style>html,body{margin:0;height:100%;background:#113443;color:#f3eddf;font-family:system-ui}body{display:grid;grid-template-rows:minmax(0,1fr) auto}#canvas{display:block;width:100%;height:100%;max-height:100dvh;outline:0}body[data-licenses-visible] #canvas{max-height:calc(100dvh - 32px)}#licenses{height:32px;box-sizing:border-box;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;background:#113443;font-size:13px}#licenses[hidden]{display:none}#licenses a{color:#f3eddf;padding:6px 8px}body[data-licenses-visible] #load{bottom:32px}#load{position:fixed;inset:0;display:grid;place-content:center;gap:24px;text-align:center;background:#113443}h1{font-size:64px;font-weight:500;letter-spacing:.18em;margin:0}progress{width:260px;height:4px;accent-color:#e25c3e}button{padding:14px 24px;background:#e25c3e;color:white;border:0;font:inherit;cursor:pointer}#error{max-width:32em;white-space:pre-wrap}</style>$GODOT_HEAD_INCLUDE</head><body data-licenses-visible><canvas id="canvas" tabindex="0" aria-label="天砕のゲーム画面">WebGL 2に対応したブラウザが必要です。</canvas><div id="load"><h1>天砕</h1><progress id="progress"></progress><div id="error" role="status"></div><button id="retry" hidden>再読み込み</button></div><footer id="licenses"><a href="licenses/index.html" target="_blank" rel="noopener noreferrer">Licenses</a></footer><script src="$GODOT_URL"></script><script>const qaEnabled=new URLSearchParams(location.search).get('qa')==='1';const qaHooks={};if(qaEnabled){const report=(kind,parts)=>{const text=parts.map(String).join(' ');fetch('/__qa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,text,userAgent:navigator.userAgent,viewport:[innerWidth,innerHeight,devicePixelRatio]})}).catch(()=>{})};qaHooks.onPrint=(...parts)=>{console.log(...parts);report('stdout',parts)};qaHooks.onPrintError=(...parts)=>{console.error(...parts);report('stderr',parts)}}const engine=new Engine({...$GODOT_CONFIG,...qaHooks}),loading=document.querySelector('#load'),progress=document.querySelector('#progress');document.querySelector('#retry').onclick=()=>location.reload();engine.startGame({canvas:document.querySelector('#canvas'),onProgress:(current,total)=>{if(total>0){progress.max=total;progress.value=current}}}).then(()=>loading.remove()).catch(e=>{progress.hidden=true;document.querySelector('#error').textContent='起動できませんでした。ページを再読み込みしてください。\n'+String(e);document.querySelector('#retry').hidden=false;console.error(e)});const licenseFooter=document.querySelector('#licenses');function updateLicenseVisibility(){const visible=!document.pointerLockElement;licenseFooter.hidden=!visible;document.body.toggleAttribute('data-licenses-visible',visible)}document.addEventListener('pointerlockchange',updateLicenseVisibility);updateLicenseVisibility();window.addEventListener('contextmenu',e=>e.preventDefault());</script></body></html>
