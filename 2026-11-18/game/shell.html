<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132438">
<meta name="description" content="6人で走る港の障害物レース。潮風ふ頭と夕焼けコンテナヤードを加速とダイブで駆け抜けよう。">
<title>リボンラリー！｜港の障害物レース</title>
$GODOT_HEAD_INCLUDE
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px)}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#122537;color:#fff8e7;font-family:system-ui,sans-serif;overflow:hidden}
#canvas{display:block;width:100%;height:100%;max-width:100%;max-height:100%;touch-action:none;outline:0} #load{position:fixed;inset:0;background:#122537;display:grid;place-items:center;padding:max(20px,var(--safe-top)) max(20px,var(--safe-right)) max(20px,var(--safe-bottom)) max(20px,var(--safe-left))} #load[hidden],[hidden]{display:none!important}
main{width:min(490px,100%);text-align:center} main img{width:100%;border-radius:12px} h1{font-size:26px;margin:18px 0 6px} p{margin:12px 0}progress{width:65%;height:8px;accent-color:#ff7050}button{min-width:44px;min-height:44px;font:inherit;font-weight:700;border:0;border-radius:8px;background:#fff0bc;color:#10243a;padding:14px 24px}small{display:block;margin-top:24px;font-size:11px} a{display:inline-grid;min-width:44px;min-height:44px;place-items:center;color:#bbd4df}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="リボンラリー！ 左右に移動。タップかスペースでジャンプ、空中でもう一度押すとダイブ。加速は加速ボタンかShift。"></canvas>
<div id="load" role="status"><main><img src="cover.jpg" alt="港で6人が回転バーを跳び越えるリボンラリー！"><h1>港の障害物レース</h1><p id="message">コースを読み込み中…</p><progress id="meter"></progress><button id="retry" hidden>読み込み直す</button><small><a href="GODOT-COPYRIGHT.txt">Godot</a> · <a href="NOTO-OFL.txt">Noto</a></small></main></div>
<noscript>プレイするにはJavaScriptを有効にしてください。</noscript>
<script>
const meter = document.getElementById('meter');
const message = document.getElementById('message');
const retry = document.getElementById('retry');
retry.onclick = () => location.reload();
function ribbonRallyViewport() {
  const bounds = document.getElementById('canvas').getBoundingClientRect();
  const style = getComputedStyle(document.documentElement);
  const inset = side => parseFloat(style.getPropertyValue('--safe-' + side)) || 0;
  return {
    width: bounds.width, height: bounds.height,
    top: inset('top'), right: inset('right'), bottom: inset('bottom'), left: inset('left')
  };
}
function failed() {
  meter.hidden = true;
  message.textContent = '読み込めませんでした。通信とブラウザのWebGL 2設定をご確認ください。';
  retry.hidden = false;
}
</script>
<script src="$GODOT_URL" onerror="failed()"></script>
<script>
if(typeof Engine !== 'undefined'){
  const engine = new Engine($GODOT_CONFIG);
  if(Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED}).length) failed();
  else engine.startGame({onProgress(current,total){if(total>0){meter.max=total;meter.value=current}}}).then(()=>{
    document.getElementById('load').hidden=true;
    document.getElementById('canvas').focus();
  }).catch(failed);
}
</script>
</body></html>
