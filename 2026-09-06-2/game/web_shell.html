<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>へんないきものの系譜</title>
$GODOT_HEAD_INCLUDE
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f2df;color:#253d36;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}canvas:focus-visible{outline:3px solid #dc694b;outline-offset:-3px}#status{position:fixed;inset:0;display:grid;place-content:center;gap:20px;padding:24px;background:#f7f2df}#status[hidden]{display:none}h1{font-size:clamp(26px,5vw,48px);margin:0}p{max-width:32em;line-height:1.8}button{font:inherit;background:#b4ce9b;color:#253d36;border:3px solid;padding:12px;cursor:pointer}progress{width:100%;accent-color:#dc694b}</style></head><body>
<canvas id="canvas" tabindex="0" aria-label="へんないきものの系譜。生物をクリックで観察。Spaceで停止、1・2・4で速度、Nで次の個体、Rで雨、Fで追跡、Tabで操作を選択。"></canvas>
<div id="status" role="status"><h1>へんないきものの系譜</h1><p id="message">小さな島に、生命を準備しています。</p><progress id="progress"></progress><button id="retry" hidden>もう一度読み込む</button></div>
<script>function showLoadError(){document.getElementById('message').textContent='読み込めませんでした。接続とWebGL 2対応ブラウザを確認して再試行してください。';document.getElementById('progress').hidden=true;document.getElementById('retry').hidden=false;document.getElementById('retry').onclick=()=>location.reload();}</script>
<script src="$GODOT_URL" onerror="showLoadError()"></script><script>
if(typeof Engine!=='undefined'){
const engine=new Engine($GODOT_CONFIG);engine.startGame({onProgress(c,t){if(t>0){document.getElementById('progress').max=t;document.getElementById('progress').value=c;}}}).then(()=>{document.getElementById('status').hidden=true;document.getElementById('canvas').focus();}).catch(showLoadError);
}
</script></body></html>
