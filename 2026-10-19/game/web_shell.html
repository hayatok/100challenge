<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>残響の魔女 | 三つの夜を越えて</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23dbc182' d='m16 2 8 20 7 6H1l7-6z'/%3E%3C/svg%3E">
$GODOT_HEAD_INCLUDE
<style>
:root{--ui-canvas:#101b25;--ui-surface:#172533;--ui-ink:#F5EFDF;--ui-muted:#C2BDB0;--ui-line:#867a61;--ui-accent:#DBC182;--ui-error:#ED8C87}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#161d32;overflow:hidden}body{font-family:system-ui,'Noto Sans JP',sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#status,#portrait{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 70% 25%,#233b48 0%,var(--ui-canvas) 65%);color:var(--ui-ink);z-index:3}#status[hidden],#portrait[hidden],button[hidden],progress[hidden]{display:none!important}h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(32px,7vw,56px);letter-spacing:.1em;margin:0 0 12px}p{font-size:16px;line-height:1.8;max-width:36em}small{font-size:13px;color:var(--ui-muted)}progress{width:min(360px,85vw);height:12px;margin:16px;accent-color:var(--ui-accent)}button{min-height:44px;padding:12px 24px;font:inherit;border:2px solid var(--ui-ink);border-radius:4px;background:var(--ui-accent);color:#161d32;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--ui-accent);outline-offset:3px}#portrait{z-index:4}#portrait h2{font-size:28px;margin:0}#portrait p{max-width:22em}#legal{position:fixed;right:10px;bottom:5px;z-index:1;font-size:11px;color:#c2bdb0;text-decoration:none;background:#161d32cc;padding:2px 5px;border-radius:3px}
</style></head><body>
<canvas id="canvas" tabindex="0" aria-label="残響の魔女。WASDまたは矢印キーで移動、攻撃は自動。数字1から3で強化、Escでポーズ。"></canvas>
<div id="status" role="status"><small>月下の庭園から、夜明けの鐘楼へ</small><h1>残響の魔女</h1><p id="message">夜の庭園を読み込んでいます。</p><progress id="progress" aria-label="読み込み状況"></progress><button id="retry" hidden>もう一度読み込む</button><p><small>2秒前の自分と、三つの夜を越える。</small></p></div>
<div id="portrait" hidden><h2>横に広げて遊びます</h2><p>このゲームはPCのキーボードで操作します。<br>ウィンドウを横に広げると、ゲームが表示されます。</p><p><small>目安：横960px以上。タッチ操作は未対応です。</small></p></div>
<a id="legal" href="credits.html" target="_blank" rel="noopener">素材・ライセンス</a>
<script>
const statusView=document.getElementById('status'), message=document.getElementById('message'), progress=document.getElementById('progress'), retry=document.getElementById('retry'), canvas=document.getElementById('canvas'), portrait=document.getElementById('portrait');
let gameLoaded=false;
function showLoadError(){statusView.hidden=false;message.textContent='ゲームを読み込めませんでした。接続とWebGL 2対応ブラウザを確認して、もう一度読み込んでください。';progress.hidden=true;retry.hidden=false;retry.focus();}
retry.addEventListener('click',()=>location.reload());
window.addEventListener('unhandledrejection',()=>{if(!gameLoaded)showLoadError();});
window.addEventListener('error',()=>{if(!gameLoaded)showLoadError();});
const narrow=matchMedia('(max-width:759px), (orientation:portrait)');
function updateSize(){portrait.hidden=!narrow.matches;if(narrow.matches)canvas.blur();}
narrow.addEventListener('change',updateSize);updateSize();
</script>
<script src="$GODOT_URL" onerror="showLoadError()"></script>
<script>
if(typeof Engine!=='undefined'){
 const engine=new Engine($GODOT_CONFIG);
 engine.startGame({onProgress(current,total){if(total>0){progress.max=total;progress.value=current;message.textContent='夜の庭園を読み込んでいます。 '+Math.round(current/total*100)+'%';}}}).then(()=>{gameLoaded=true;statusView.hidden=true;if(!narrow.matches)canvas.focus();}).catch(error=>{showLoadError();console.error(error);});
}
</script></body></html>
