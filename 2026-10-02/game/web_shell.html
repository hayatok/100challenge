<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="description" content="BLACK RELAY 黒雨の街。一語、一撃。商店街を抜けろ。オリジナル3Dタイピングホラー。">
<title>BLACK RELAY | 黒雨の街</title>
$GODOT_HEAD_INCLUDE
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071117;color:#e0e5d8;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#status{position:fixed;inset:0;display:grid;place-content:center;padding:32px;background:radial-gradient(ellipse at 70% 25%,#16343b,#071117 70%);z-index:3}#status[hidden]{display:none}.shell{width:min(560px,90vw)}.eyebrow{color:#ffad42;letter-spacing:.13em;font-size:12px}h1{font-size:clamp(45px,9vw,78px);line-height:1.05;letter-spacing:.05em;margin:25px 0 12px}h2{font:500 22px system-ui,sans-serif;letter-spacing:.32em;margin:0 0 44px;color:#a8bdbc}#message{font-size:14px;line-height:1.8;color:#a8bdbc;min-height:3.6em}progress{width:100%;height:5px;accent-color:#ffad42;border:0;background:#233b42}progress::-webkit-progress-bar{background:#233b42}progress::-webkit-progress-value{background:#ffad42}.help{font:13px/1.9 system-ui,sans-serif;color:#829da3;margin-top:28px}button{font:inherit;background:#ffad42;color:#071117;border:2px solid #f9c785;padding:15px 22px;cursor:pointer;margin-top:22px}button:focus-visible{outline:3px solid #86d4d0;outline-offset:5px}noscript{position:fixed;inset:0;padding:50px;background:#071117;z-index:5}#mobile{display:none;color:#ffad42}.mobile-mode #mobile{display:block}
#credits{position:fixed;right:10px;top:5px;z-index:2;color:#b7c0bd;font:10px system-ui;text-decoration:none;background:#071117b0;padding:3px 7px}#credits:focus-visible{outline:2px solid #ffad42}
/* Touch UI uses the same night/ivory/amber palette as the authored game HUD. */
[hidden]{display:none!important}#mobile-toggle{position:fixed;top:32px;right:10px;z-index:2;min-height:44px;margin:0;padding:8px 12px;font:13px system-ui,sans-serif;background:#142126;color:#f1eee4;border-color:#506267}
#mobile-ui{position:fixed;left:var(--br-visual-left,0px);width:var(--br-visual-width,100%);top:var(--br-visual-top,0px);height:var(--br-visual-height,100dvh);z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));pointer-events:none;font:16px/1.35 system-ui,-apple-system,sans-serif;color:#f1eee4}
#mobile-ui button,#mobile-input{min-height:44px;min-width:44px;margin:0;border:2px solid #506267;border-radius:4px;font:16px/1.3 system-ui,-apple-system,sans-serif;touch-action:manipulation}#mobile-ui button{padding:8px 12px;background:#142126;color:#f1eee4;cursor:pointer}#mobile-ui button.mobile-primary,#mobile-begin{background:#ffc26b;color:#080e11;border-color:#ffc26b}#mobile-ui button:disabled{color:#a2b0b1;background:#080e11;border-style:dashed;cursor:default}#mobile-ui button:focus-visible,#mobile-input:focus-visible{outline:3px solid #92e3d7;outline-offset:2px}
#mobile-menu{pointer-events:auto;max-height:100%;overflow:auto;overscroll-behavior:contain;width:min(560px,100%);align-self:center;padding:16px;background:#080e11f2;border:1px solid #506267;border-top:3px solid #ffc26b;border-radius:4px}#mobile-heading{font:700 clamp(22px,5vw,34px)/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:0;margin:0 0 8px;color:#f1eee4}#mobile-summary{font:14px/1.5 system-ui;margin:0 0 12px;color:#a2b0b1}#mobile-actions{display:grid;gap:8px}#mobile-actions button{text-align:left;overflow-wrap:anywhere}#mobile-begin{width:100%}
#mobile-play{pointer-events:auto;width:min(700px,100%);align-self:center;background:#080e11f2;border:1px solid #506267;border-top:2px solid #ffc26b;padding:8px;border-radius:4px;max-height:100%;overflow:auto;overscroll-behavior:contain}.mobile-readouts{display:flex;align-items:center;gap:12px;font:12px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;color:#a2b0b1}.mobile-readouts #mobile-pause{margin-left:auto;font-size:13px;padding:6px 10px}#mobile-target{margin:4px 0;font:14px/1.4 system-ui;color:#a2b0b1;overflow-wrap:anywhere}.mobile-word{font:700 clamp(22px,6vw,32px)/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.02em;overflow-wrap:anywhere;margin:0 0 6px;min-height:1.2em}#mobile-typed{color:#92e3d7}#mobile-typed:not(:empty)::after{content:'|';font-weight:400;color:#a2b0b1}#mobile-cut{margin:0 0 6px;color:#ffc26b;font:14px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.mobile-type-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.mobile-input-wrap label{display:block;font:12px/1.3 system-ui;color:#a2b0b1;margin:0 0 3px}#mobile-input{display:block;width:100%;background:#142126;color:#f1eee4;padding:8px 12px;font-size:16px;caret-color:#ffc26b}#mobile-input-hint{font:12px/1.4 system-ui;color:#a2b0b1;margin:6px 0;min-height:1.4em}.mobile-combat-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mobile-mode canvas{position:absolute;top:var(--br-visual-top,0px);left:var(--br-visual-left,0px);height:var(--br-visual-height,100dvh)}.mobile-mode #credits{right:8px;font-size:10px}.mobile-mode #status{padding:max(16px,env(safe-area-inset-top)) 16px;overflow:auto}.mobile-mode #status h1{font-size:clamp(38px,12vw,60px);margin:12px 0}.mobile-mode #status h2{margin-bottom:16px}
@media(orientation:landscape) and (max-height:500px){#mobile-ui{padding-top:4px;padding-bottom:4px}#mobile-play{width:min(920px,100%);padding:6px;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,1fr);gap:0 12px}.mobile-readouts{grid-column:1}.mobile-target-group{grid-column:1;grid-row:2/5;align-self:center}.mobile-word{font-size:clamp(22px,4vw,30px)}.mobile-type-row{grid-column:2;grid-row:1/3}#mobile-input-hint{grid-column:2;grid-row:3;margin:4px 0}.mobile-combat-controls{grid-column:2;grid-row:4}#mobile-menu{padding:12px}#mobile-heading{font-size:22px}#mobile-summary{margin-bottom:8px}}
</style>
</head><body>
<canvas id="canvas" tabindex="0" aria-label="BLACK RELAY タイピングホラー。ローマ字入力、Tabで標的変更、Escで一時停止。"></canvas>
<div id="status" role="status"><div class="shell"><p class="eyebrow">KUROAME // STREET ESCAPE</p><h1>BLACK<br>RELAY</h1><h2>黒雨の街</h2><p id="message">商店街を読み込み中…</p><progress id="progress"></progress><button id="retry" hidden>接続をやり直す / RETRY</button><p class="help">PC と物理キーボードを推奨。日本語 IME をオフにして入力。<br>ヘッドホン推奨。音量と画面の揺れはゲーム内で調整できます。</p><p id="mobile" class="help">スマートフォンは英字キーボードで入力。出発・再開をタップするとキーボードが開きます。</p></div></div>
<button id="mobile-toggle" type="button" hidden>タッチ操作 / Touch controls</button>
<div id="mobile-ui" hidden aria-label="タッチ操作 / Touch controls">
  <section id="mobile-menu" aria-labelledby="mobile-heading">
    <h2 id="mobile-heading">BLACK RELAY</h2><p id="mobile-summary"></p>
    <nav id="mobile-actions" aria-label="ゲームメニュー / Game menu"></nav>
    <button id="mobile-begin" type="button" class="mobile-primary" hidden>出発・キーボードを開く / BEGIN</button>
  </section>
  <section id="mobile-play" aria-label="タイピング操作 / Typing controls" hidden>
    <div class="mobile-readouts"><span id="mobile-hp">HP</span><span id="mobile-score">SCORE</span><button id="mobile-pause" type="button">一時停止 / Pause</button></div>
    <div class="mobile-target-group"><p id="mobile-target"></p><p class="mobile-word" aria-label="入力済みと残りの文字 / Typed and remaining letters"><span id="mobile-typed"></span><span id="mobile-remaining"></span></p><p id="mobile-cut" hidden></p></div>
    <div class="mobile-type-row"><div class="mobile-input-wrap"><label for="mobile-input">ローマ字 / TYPE A–Z</label><input id="mobile-input" type="text" lang="en" inputmode="text" enterkeyhint="next" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-describedby="mobile-input-hint" disabled></div><button id="mobile-keyboard" type="button">入力する / Keyboard</button></div>
    <p id="mobile-input-hint" role="status" aria-live="polite"></p>
    <div class="mobile-combat-controls"><button id="mobile-cycle" type="button">次の標的 / Next target</button><button id="mobile-reset" type="button">入力リセット / Reset</button></div>
  </section>
</div>
<script src="web_mobile.js"></script>
<a id="credits" href="credits.html" target="_blank" rel="noopener">Credits / ライセンス</a>
<noscript>BLACK RELAY の実行には JavaScript と WebGL 2 が必要です。</noscript>
<script>
function showLoadError(error){const message=document.getElementById('message');message.textContent='接続できませんでした。通信と WebGL 2 対応を確認し、もう一度お試しください。';document.getElementById('progress').hidden=true;document.getElementById('retry').hidden=false;document.getElementById('retry').onclick=()=>location.reload();if(error)console.error(error);}
</script>
<script src="$GODOT_URL" onerror="showLoadError()"></script>
<script>
if(typeof Engine!=='undefined'){
 const config=$GODOT_CONFIG;
 if(window.BlackRelayMobile && window.BlackRelayMobile.isEnabled())config.canvasResizePolicy=0;
 const engine=new Engine(config);
 const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
 if(missing.length){showLoadError(new Error(missing.join(', ')));}
 else engine.startGame({onProgress(current,total){if(total>0){const progress=document.getElementById('progress');progress.max=total;progress.value=current;document.getElementById('message').textContent='商店街を読み込み中… '+Math.round(current/total*100)+'%';}}}).then(()=>{document.getElementById('status').hidden=true;if(!window.BlackRelayMobile || !window.BlackRelayMobile.isEnabled())document.getElementById('canvas').focus();}).catch(showLoadError);
}
</script></body></html>
