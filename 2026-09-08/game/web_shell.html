<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>こわさず、壊す。</title>
$GODOT_HEAD_INCLUDE
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#ece7db;color:#343e3b;font-family:system-ui,sans-serif}body{height:max(100dvh,720px);overflow-y:auto;overflow-x:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}canvas:focus-visible{outline:2px solid #987333;outline-offset:-2px}#status{position:fixed;inset:0;display:grid;place-content:center;gap:18px;padding:28px;background:#ece7db}#status[hidden]{display:none}h1{font-size:clamp(30px,5vw,48px);font-weight:500;margin:0}p{max-width:30em;line-height:1.8}button{font:inherit;background:#426d60;color:#faf6e9;border:1px solid #426d60;padding:14px;cursor:pointer}progress{width:100%;accent-color:#987333}.eyebrow{font-size:12px;letter-spacing:.18em;color:#987333}@media(max-width:899px){body{height:max(100dvh,calc(100vw * .645833 + 610px));overflow-y:auto}canvas{height:100%}}</style></head><body>
<canvas id="canvas" tabindex="0" aria-label="こわさず、壊す。番号の接合点をクリック、タップまたは1〜9キーで切断。陶器を緑の梱包箱へ。Rでやり直す、Spaceで停止と再開、Hでヒント、Nで次の面。Tabで操作を選択。"></canvas>
<div id="status" role="status"><span class="eyebrow">A SMALL ATELIER OF DEMOLITION</span><h1>こわさず、壊す。</h1><p id="message">木の梁を並べ、陶器をそっと置いています。</p><progress id="progress" aria-label="模型の読み込み"></progress><button id="retry" hidden>もう一度読み込む</button></div>
<script>function showLoadError(){document.getElementById('message').textContent='模型を読み込めませんでした。接続とWebGL 2対応ブラウザを確認し、もう一度読み込んでください。';document.getElementById('status').hidden=false;document.getElementById('progress').hidden=true;document.getElementById('retry').hidden=false;document.getElementById('retry').onclick=()=>location.reload();}</script>
<script src="$GODOT_URL" onerror="showLoadError()"></script><script>
if(typeof Engine!=='undefined'){
const engine=new Engine($GODOT_CONFIG);engine.startGame({onProgress(c,t){if(t>0){document.getElementById('progress').max=t;document.getElementById('progress').value=c;}}}).then(()=>{document.getElementById('status').hidden=true;document.getElementById('canvas').focus();}).catch(showLoadError);
}
</script></body></html>
