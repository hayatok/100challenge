<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まるのみ怪獣</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173037;color:#fff0ca;font-family:system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;outline:none}#status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:20px;background:#173037;z-index:3}h1{font-size:36px;margin:0}progress{width:260px;accent-color:#f37850}#mobile{display:none;position:fixed;left:0;right:0;bottom:0;text-align:center;padding:6px;background:#173037;font-size:12px}@media(pointer:coarse){#mobile{display:block}}body.ready #status{display:none}</style>$GODOT_HEAD_INCLUDE</head><body><canvas id="canvas" tabindex="0">このゲームにはWebGL 2対応のブラウザが必要です。</canvas><div id="status"><h1>まるのみ怪獣</h1><div id="message">街を準備しています…</div><progress id="progress" max="100" value="0"></progress></div><div id="mobile">キーボードとマウスで遊ぶゲームです。PCでお楽しみください。</div><script src="$GODOT_URL"></script><script>const engine=new Engine($GODOT_CONFIG);engine.startGame({canvas:document.getElementById('canvas'),canvasResizePolicy:2,onProgress:(loaded,total)=>{if(total>0)document.getElementById('progress').value=loaded/total*100}}).then(()=>{document.body.classList.add('ready');document.getElementById('canvas').focus()}).catch(error=>{document.getElementById('message').textContent='街を読み込めませんでした。WebGL 2対応のブラウザで再読み込みしてください。';console.error(error)});</script></body></html>
