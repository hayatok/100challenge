<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf4e6"><title>潮還り / SHIOGAERI</title><meta name="description" content="潮に沈む街の回収屋。装備を選び、一手ずつ戦い、戦利品を港へ持ち帰る探索ゲーム。">
<style>html,body{margin:0;width:100%;height:100%;background:#eaf4e6;overflow:hidden;font-family:system-ui,sans-serif;color:#183e52}canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:linear-gradient(#fff8e517,#fff8e544),url(shiogaeri-cover.png) center/cover;z-index:5;padding:24px}h1{font-family:serif;font-size:64px;font-weight:500;margin:0 0 16px;letter-spacing:.1em}small{letter-spacing:.45em;color:#946124}p{font-size:15px;line-height:1.8}progress{width:min(75vw,320px);height:5px;accent-color:#946124;margin:20px auto}button{min-height:48px;padding:10px 24px;background:#f4c05d;border:1px solid #d9c4a0;color:#183e52;font:inherit;border-radius:3px}#loading::before{content:"";position:absolute;inset:calc(50% - 205px) max(20px,calc(50% - 210px));background:#fff8e5ef;border:2px solid #90bcb7;border-radius:18px;box-shadow:0 14px 45px #1c626538;z-index:-1}#error{display:none;max-width:440px;white-space:pre-line;line-height:1.8}</style>
<style>#safe-area-probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}</style>
$GODOT_HEAD_INCLUDE
</head><body><div id="safe-area-probe" aria-hidden="true"></div><canvas id="canvas" tabindex="0" aria-label="潮還り。矢印キーで一手移動、Eで調べる、Iで持ち物、Spaceで待機。画面のボタンでも操作できます。"></canvas><div id="loading"><small>SHIOGAERI</small><h1>潮還り</h1><p>潮の街で、宝物と帰り道を。</p><progress id="progress" aria-label="読み込み状況"></progress><p id="status">港を準備しています…</p><div id="error"></div></div>
<script src="$GODOT_URL"></script><script>
const engine=new Engine($GODOT_CONFIG),loading=document.getElementById('loading');
engine.startGame({canvas:document.getElementById('canvas'),onProgress(current,total){const b=document.getElementById('progress');if(total>0){b.max=total;b.value=current;}},onExit(){loading.style.display='grid';document.getElementById('status').textContent='ゲームを終了しました。';}}).then(()=>{loading.style.display='none';document.getElementById('canvas').focus();}).catch(error=>{document.getElementById('status').textContent='ゲームを起動できませんでした。';const box=document.getElementById('error');box.style.display='block';box.textContent='読み込みをやり直してください。続きの保存データはこのブラウザに残ります。\n';const b=document.createElement('button');b.textContent='再読み込み';b.onclick=()=>location.reload();box.append(b);console.error(error);});
</script></body></html>
