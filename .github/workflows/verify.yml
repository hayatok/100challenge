name: Verify site

on:
  pull_request:
    paths:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/**'
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*/**'
      - 'apps.json'
      - 'package.json'
      - 'scripts/**'
      - 'showcase/**'
      - '.github/workflows/verify.yml'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main]
    paths:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/**'
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*/**'
      - 'apps.json'
      - 'package.json'
      - 'scripts/**'
      - 'showcase/**'
      - '.github/workflows/verify.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install app dependencies
        run: npm run ci:apps
      - name: Test and build the complete site
        run: npm run check
