name: Verify site

on:
  pull_request:
    paths:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/**'
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*/**'
      - 'apps.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'showcase/**'
      - '.github/workflows/verify.yml'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main]
    paths:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/**'
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*/**'
      - 'apps.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'showcase/**'
      - '.github/workflows/verify.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Test catalog and change selection
        run: npm test
      - name: Select changed apps
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/changed-apps.mjs "$BASE_SHA"
      - name: Install selected app dependencies
        env:
          CHANGED_APPS: ${{ steps.changes.outputs.apps }}
        run: npm run ci:apps -- --apps-json "$CHANGED_APPS"
      - name: Test and build selected apps
        env:
          CHANGED_APPS: ${{ steps.changes.outputs.apps }}
        run: npm run check:apps -- --apps-json "$CHANGED_APPS"
      - name: Build complete site for shared changes
        if: steps.changes.outputs.full == 'true'
        run: npm run build:site -- --prebuilt
