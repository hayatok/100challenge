name: Verify daily app

on:
  pull_request:
    paths:
      - '2026-09-01/**'
      - '.github/workflows/verify.yml'
  push:
    branches: [main]
    paths:
      - '2026-09-01/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2026-09-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 2026-09-01/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
