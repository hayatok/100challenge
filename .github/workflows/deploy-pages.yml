name: Deploy GitHub Pages

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild and check every app without reusing published output
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Test deployment scripts and catalog
        run: npm test
      - name: Restore last successful Pages output
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.full_rebuild || false }}
        run: node scripts/restore-pages.mjs
      - name: Select changed or missing apps
        id: changes
        env:
          FORCE_FULL: ${{ inputs.full_rebuild || false }}
        run: node scripts/pages-plan.mjs
      - name: Install selected app dependencies
        env:
          CHANGED_APPS: ${{ steps.changes.outputs.apps }}
        run: npm run ci:apps -- --apps-json "$CHANGED_APPS"
      - name: Test and build selected apps
        env:
          CHANGED_APPS: ${{ steps.changes.outputs.apps }}
        run: npm run check:apps -- --apps-json "$CHANGED_APPS"
      - name: Assemble complete site from checked and reused apps
        env:
          CHANGED_APPS: ${{ steps.changes.outputs.apps }}
        run: npm run build:site -- --prebuilt --apps-json "$CHANGED_APPS" --reuse-from .pages-baseline/site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
