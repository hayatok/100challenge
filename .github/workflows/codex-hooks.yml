name: Verify Codex project hooks

on:
  pull_request:
    paths:
      - '.codex/**'
      - 'docs/CODEX_HOOKS.md'
      - '.github/workflows/codex-hooks.yml'
  push:
    branches: [main]
    paths:
      - '.codex/**'
      - 'docs/CODEX_HOOKS.md'
      - '.github/workflows/codex-hooks.yml'

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test .codex/hooks/quality.test.mjs
