<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Web player touch input inspection</title>
<style>body{background:#192221;color:#faf7e4;font:16px system-ui}iframe{border:0;display:block}pre{white-space:pre-wrap}</style>
<iframe id="game" allow="autoplay" title="Evacuation Control"></iframe><pre id="results">Loading the inspection build…</pre>
<script>
(async () => {
    const params = new URLSearchParams(location.search);
    const frame = document.querySelector('#game'), log = document.querySelector('#results');
    frame.width = params.get('width') || 844;
    frame.height = params.get('height') || 390;
    frame.src = 'index.html?controls=touch'+(params.has('failure')?'&duty-failure=1':'')+(params.has('flood-columns')?'&flood-columns=1':'');
    const win = frame.contentWindow;
    const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
    const audit = () => win.evacInspection;
    const wait = async (name, probe, time = 12000) => {
        const end=performance.now()+time;
        do {const value=probe();if(value)return value;await pause(50);} while(performance.now()<end);
        throw new Error(name+' timed out, state '+JSON.stringify(audit()?.state)+'; buttons '+Object.keys(audit()?.buttons||{}).join(',')+'; recent presses '+(audit()?.clicks||[]).join(','));
    };
    const active = new Map();
    let canvas;
    function finger(kind, id, x, y) {
        const bounds=canvas.getBoundingClientRect();
        const t=new win.Touch({identifier:id,target:canvas,clientX:bounds.x+x*bounds.width,clientY:bounds.y+y*bounds.height,
            radiusX:5,radiusY:5,force:.7});
        if(kind==='touchend')active.delete(id); else active.set(id,t);
        canvas.dispatchEvent(new win.TouchEvent(kind,{touches:[...active.values()],targetTouches:[...active.values()],
            changedTouches:[t],bubbles:true,cancelable:true}));
    }
    async function button(pattern) {
        const xy=await wait('Button '+pattern,()=>Object.entries(audit().buttons).find(([k])=>pattern.test(k))?.[1]);
        const before=audit().frame;
        finger('touchstart',8,...xy);
        await wait('Contact on '+pattern,()=>audit().frame>before && audit().state.fingers>0);
        finger('touchend',8,...xy);
        await wait('Release of '+pattern,()=>audit().state.fingers===0);
    }
    await wait('Unity',()=>audit()?.state?.phase===(params.has('flood-columns')?'Playing':'Title'),90000);
    canvas=win.document.querySelector('canvas');
    log.textContent='Loaded '+frame.width+'×'+frame.height+'.';
    if(params.has('large-text')){
        await button(/^設定$/);
        await button(/^文字サイズ　標準$/);
        await wait('Large text selected',()=>Object.keys(audit().buttons).includes('文字サイズ　大'));
        await button(/^戻る$/);
    }
    const custom=params.has('custom');
    if (custom) {
        await button(/^設定$/);
        await button(/^タッチ操作$/);
        await button(/^内側$/);
        await button(/^上$/);
        await button(/^設定に戻る$/);
        await button(/^キー設定$/);
        await button(/^装填　/);
        const key=(type)=>new win.KeyboardEvent(type,{key:'v',code:'KeyV',keyCode:86,which:86,bubbles:true,cancelable:true});
        canvas.dispatchEvent(key('keydown'));await pause(140);canvas.dispatchEvent(key('keyup'));
        await wait('Keyboard assignment V',()=>Object.keys(audit().buttons).some(k=>/^装填　V$/.test(k)));
        await button(/^初期設定に戻す$/);
        await button(/^設定に戻る$/);
        await button(/^戻る$/);
    }
    if (params.has('duty')) {
        if(params.has('failure')) {
            await button(/^作戦を選ぶ/);await button(/^出動する/);await button(/^一時停止/);
            await button(/^タイトルへ$/);await button(/^タイトルに戻る$/);
            await wait('Preserved regular campaign',()=>audit().state.phase==='Title');
        }
        await button(/^救援当直/);
        await button(/^03 /);
        await button(/^この当直を始める$/);
        if(params.has('failure')) {
            await wait('Failed at a later duty stage',()=>audit()?.duty?.expected>=1 && audit().state.phase==='Debrief');
            await button(/^直前の記録から$/);
            await wait('Restored the correct duty checkpoint and preserved campaign files',()=>
                audit().state.phase==='Playing' && audit().duty.sector===audit().duty.expected && audit().duty.unchanged);
        } else await wait('Independent duty',()=>audit().state.phase==='Playing');
        await button(/^一時停止/);
        await wait('Duty pause',()=>audit().state.phase==='Paused');
        log.textContent='PASS '+frame.width+'×'+frame.height+' | Opened district 03 from the duty desk, deployed and paused.'+
            (params.has('failure')?' Recovered stage '+(audit().duty.expected+1)+' from the defeat screen and retained the regular campaign.':'');
        return;
    }
    if(!params.has('flood-columns')){
        await button(/^作戦を選ぶ/);await wait('Briefing',()=>audit().state.phase==='Briefing');
        await button(/^出動する/);await wait('Command',()=>audit().state.phase==='Playing');
    }
    const articles=()=>Object.keys(audit().buttons);
    async function capture(name) {
        if(params.get('capture')==='series'){
            await pause(200);
            window.evacCapture=name;
            await wait('Capture '+name,()=>window.evacCapture!==name,20000);
            return false;
        }
        if(params.get('capture')!==name)return false;
        await pause(250);
        log.textContent='CAPTURE '+name+' '+frame.width+'×'+frame.height;
        return true;
    }
    if(params.has('flood-columns')){
        await wait('Flooded rail inspection fixture',()=>articles().includes('避難隊列'),90000);
        if(await capture('flood-map'))return;
        await button(/^避難隊列$/);
        await wait('Two separate rosters',()=>articles().includes('北改札の歩行列') && articles().includes('救護室の介助列'));
        if(params.has('bearer-fps')){
            await button(/^救護室の介助列$/);await button(/^警備班$/);await button(/^担架を引き受ける$/);
            await wait('Bearer physically reached patient',()=>articles().some(k=>/^担架　.+に入る$/.test(k)),150000);
            if(await capture('bearer-ready'))return;
            await button(/^担架　.+に入る$/);
            await wait('Possessed physical bearer',()=>audit().state.mode==='FPS' && articles().includes('担架の引き継ぎ'));
            const arrivalFrame=audit().frame, arrivalTime=performance.now();
            await wait('First-person camera settled across rendered frames',()=>
                performance.now()-arrivalTime>=1200 && audit().frame>=arrivalFrame+36 && audit().state.mode==='FPS',30000);
            if(articles().includes('照準')||articles().includes('装填'))throw new Error('Weapon controls available while carrying');
            if(await capture('bearer-fps'))return;
            await button(/^担架の引き継ぎ$/);
            await button(/^担架を下ろす$/);
            await button(/^閉じる$/);
            await wait('Released patient and regained weapon controls',()=>articles().includes('照準'));
            const full=audit().state.ammo;
            finger('touchstart',6,.86,.72);
            await wait('Able to fire after putting down the patient',()=>audit().state.ammo<full);
            finger('touchend',6,.86,.72);
            await wait('Touch released and reload available',()=>audit().state.fingers===0 && articles().includes('装填'));
            await button(/^装填$/);
            await wait('Magazine restored',()=>audit().state.ammo===full);
            if(await capture('bearer-released'))return;
            await button(/^指揮に戻る$/);
            log.textContent='PASS '+frame.width+'×'+frame.height+' | Squad walked to the patient. Possessed the named bearer, saw the physical carrying HUD, put down the stretcher and returned to command.';
            return;
        }
        await button(/^北改札の歩行列$/);
        await button(/^警備班$/);await button(/^誘導放送を入れる$/);
        await button(/^救護室の介助列$/);
        await button(/^誘導班$/);
        if(await capture('flood-column-roll'))return;
        await button(/^保守通路経由$/);await button(/^列を止める$/);await button(/^同行を再開$/);
        await button(/^整備班$/);await button(/^防火扉を開ける$/);
        await button(/^負傷者を手当て/);
        if(params.has('stretcher')){await button(/^警備班$/);await button(/^担架を引き受ける$/);}
        await button(/^地図で隊列を見る$/);
        await wait('Back on station floor',()=>!articles().includes('閉じる'));
        for(let i=0;i<2 && articles().includes('畳む');i++)await button(/^畳む$/);
        if(await capture('flood-dispatched'))return;
        log.textContent='PASS '+frame.width+'×'+frame.height+' | Inspector prepared operation 06. Tapped both resident manifests, dispatched PA and bypass crews, led the assisted column, held and resumed it, and called for first aid.';
        return;
    }
    if(params.has('reload-pad')){
        if(!articles().some(k=>/を直接操作$/.test(k)))await button(/^名簿/);
        await button(/を直接操作$/);
        await wait('First person with a loaded magazine',()=>audit().state.mode==='FPS' && audit().state.ammo>0);
        const capacity=audit().state.ammo;
        const trigger=[.86,.72];
        finger('touchstart',5,...trigger);
        await wait('Magazine empty',()=>audit().state.ammo===0,16000);
        await pause(900);
        if(audit().state.ammo!==0)throw new Error('Holding fire started a reload');
        finger('touchend',5,...trigger);
        await wait('Trigger released',()=>audit().state.fingers===0);
        if(await capture('empty-magazine'))return;
        finger('touchstart',5,...trigger);
        await wait('Fresh trigger press reloaded the magazine',()=>audit().state.ammo===capacity,8000);
        await pause(650);
        if(audit().state.ammo!==capacity)throw new Error('Reload contact fired after loading');
        finger('touchend',5,...trigger);
        await wait('Reload contact released',()=>audit().state.fingers===0);
        finger('touchstart',5,...trigger);
        await wait('New press fires normally',()=>audit().state.ammo<capacity);
        finger('touchend',5,...trigger);
        log.textContent='PASS '+frame.width+'×'+frame.height+' | Fired '+capacity+' rounds, reloaded with a new tap on the same pad, held without firing, and fired on the next tap.';
        return;
    }
    if(params.has('market-timing')){
        await button(/^現場方針を決める$/);
        await button(/^店先と停留所の名簿を照合$/);
        await button(/を現場へ$/);
        await wait('Market escort ready',()=>articles().includes('避難隊列'),90000);
        await button(/^避難隊列$/);await button(/^警備班$/);await button(/^軒下から誘導$/);
        if(articles().includes('地図で隊列を見る'))await button(/^地図で隊列を見る$/);
        else await button(/^閉じる$/);
        // InspectState writes once in GameSession.Update. Timestamp those writes in the test browser.
        const data=audit(),measure={RTS:[],FPS:[]};
        let current=data.state,mode='',last=0;
        Object.defineProperty(data,'state',{configurable:true,get(){return current},set(value){
            current=value;
            if(value.phase!=='Playing'||value.mode!==mode)return;
            const t=performance.now();if(last)measure[mode].push(t-last);last=t;
        }});
        mode='RTS';await pause(12000);mode='';last=0;
        if(!articles().some(k=>k.includes('を直接操作')))await button(/^名簿/);
        await button(/を直接操作$/);await wait('Officer on foot',()=>data.state.mode==='FPS');
        await pause(800);mode='FPS';await pause(12000);mode='';
        const report=Object.entries(measure).map(([name,list])=>{
            if(list.length<20)throw Error('Too few observed Unity frames');
            list.sort((a,b)=>a-b);return name+' '+list.length+' frames, p95 '+list[Math.ceil(list.length*.95)-1].toFixed(1)+' ms';
        }).join(' | ');
        log.textContent='PASS '+frame.width+'×'+frame.height+' | '+report;return;
    }
    if(params.has('market-map')){
        const navigation=params.has('navigation');
        const progress=[];
        const hud=(mode)=>audit().hud?.mode===mode ? audit().hud : null;
        async function readTask(mode,condition) {
            const current=await wait('Visible '+mode+' HUD',()=>{
                const row=hud(mode);
                return row && condition(row.action) && /[\/／]\s*0?5(?:\D|$)/.test(row.count) && row;
            });
            progress.push(mode+' '+current.action+' ['+current.count+']');
            return current;
        }
        if(navigation)await readTask('RTS',label=>/方針|対応/.test(label));
        await button(/^現場方針を決める$/);
        await button(/^店先と停留所の名簿を照合$/);
        await button(/を現場へ$/);
        await wait('Shopkeepers waiting',()=>articles().includes('避難隊列'),90000);
        await button(/^避難隊列$/);
        await wait('Live market map',()=>articles().includes('店主の名簿'));
        if(await capture('market-map'))return;
        if(params.has('dispatch-first')){
            await button(/^横戸を開ける$/);
            await wait('Opener dispatched before choosing a route',()=>audit().state.mode==='RTS' &&
                articles().some(k=>/で横戸へ$/.test(k)) && articles().includes('横戸で待ち合わせ'));
            await wait('Gate opened under AI command before selecting the route',()=>audit().market.lift>=.82);
            await button(/^軒下から誘導$/);
            await wait('Guide joined after the gate opened',()=>audit().market.leader>=0);
            await wait('Both residents at the bus',()=>audit().market.boarded===2,60000);
            log.textContent='PASS '+frame.width+'×'+frame.height+' | Dispatched the AI opener before choosing a route; sent the guide, and both shopkeepers boarded in RTS.';
            return;
        }
        const meeting=params.has('rendezvous');
        let leader;
        if(meeting){
            await button(/^横戸で待ち合わせ$/);
            await wait('Opener took the radio',()=>audit().market?.meeting && audit().state.mode==='FPS');
            leader=audit().market.leader;
        } else {
            await button(/^軒下から誘導$/);
            await wait('Guide assigned',()=>articles().some(k=>/^先導　.+に入る$/.test(k)));
            leader=audit().market.leader;
        }
        if(params.has('map-only')){
            await button(/^横戸を開ける$/);
            if(await capture('market-orders'))return;
            log.textContent='PASS '+frame.width+'×'+frame.height+' | Compared both routes and sent separate guide and gate operator from map.';return;
        }
        if(!meeting)await button(/で横戸へ$/);
        await wait('Independent second soldier',()=>audit().state.mode==='FPS' && audit().market.pawn!==leader && audit().market.pawn>=0);
        if(navigation){
            const pawn=audit().market.pawn;
            const before=await readTask('FPS',label=>/横戸/.test(label));
            await button(/^指揮に戻る$/);
            const command=await readTask('RTS',label=>label===before.action);
            if(!before.banner || command.banner!==before.banner)throw new Error('Selected soldier or location changed on return to command');
            if(!articles().some(k=>/を直接操作$/.test(k)))await button(/^名簿/);
            await button(/を直接操作$/);
            await wait('Same soldier retook the job',()=>audit().state.mode==='FPS' && audit().market.pawn===pawn);
            await readTask('FPS',label=>label===before.action);
            if(await capture('navigation-opener'))return;
        }
        if(meeting){
            const begin=audit().market.clock;
            await wait('Residents waiting after eighteen seconds',()=>{
                const m=audit().market;return m.clock>=begin+18 && m.waiting && m.meeting && !m.finished && m.boarded===0;
            },70000);
        }
        // Look toward the marked shutter using the ordinary right-thumb gesture.
        async function faceDoor(offset=0) {
            for(let i=0;i<12;i++){
                const s=audit().state;
                const heading=Math.atan2(-7-s.x,-4.6-s.z)*180/Math.PI+offset;
                const turn=((heading-s.yaw+540)%360)-180;
                if(Math.abs(turn)<8)break;
                const dx=Math.max(-.20,Math.min(.20,turn/110*frame.height/frame.width));
                finger('touchstart',4,.58,.54);
                await wait('Look contact',()=>audit().state.fingers>0);
                const start=audit().frame;
                finger('touchmove',4,.58+dx,.54);
                await wait('Look response',()=>audit().frame>=start+2);
                finger('touchend',4,.58+dx,.54);
                await wait('Lift look finger',()=>audit().state.fingers===0);
            }
        }
        if(navigation){
            await faceDoor(180);
            await wait('Destination still visible behind soldier',()=>{
                const b=audit().bearing;
                return b?.offscreen && /横戸/.test(b.destination) && b.frame>=audit().frame-3;
            });
            if(await capture('navigation-bearing'))return;
        }
        await faceDoor();
        // Drive the ordinary mobile stick along the real navigation corners. This probe only reads the simulation.
        finger('touchstart',3,.13,.77);
        await wait('Thumb on stick',()=>audit().state.fingers>0);
        const until=performance.now()+50000;
        while(!articles().some(k=>k==='横戸を開ける') && performance.now()<until){
            const s=audit().state,m=audit().market, dx=m.x-s.x,dz=m.z-s.z;
            if (Math.hypot(dx,dz)<.14) break;
            const yaw=s.yaw*Math.PI/180, length=Math.max(.12,Math.hypot(dx,dz));
            const right=(dx*Math.cos(yaw)-dz*Math.sin(yaw))/length;
            const forward=(dx*Math.sin(yaw)+dz*Math.cos(yaw))/length;
            finger('touchmove',3,.13+right*.106*frame.height/frame.width,.77-forward*.106);
            await pause(65);
        }
        finger('touchend',3,.13,.77);
        await wait('Lift steering finger',()=>audit().state.fingers===0);
        await faceDoor();
        await wait('Opener physically reached side gate',()=>articles().includes('横戸を開ける'));
        await button(/^横戸を開ける$/);
        await wait('Gate lifted to full clearance',()=>audit().market.lift>=.999);
        if(navigation)await readTask('FPS',label=>/中野|谷口|店主/.test(label));
        if(await capture('gate-fps'))return;
        await button(/^指揮に戻る$/);
        await wait('Returned to same market operation',()=>audit().state.mode==='RTS');
        if(navigation){
            await readTask('RTS',label=>/中野|谷口|店主/.test(label));
            if(await capture('navigation-command'))return;
        }
        await wait('Shopkeepers boarded',()=>audit().market.boarded===2,55000);
        if(navigation){
            log.textContent='PASS '+frame.width+'×'+frame.height+' | '+progress.join(' → ')+'. Both residents boarded.';
            return;
        }
        log.textContent='PASS '+frame.width+'×'+frame.height+' | '+(meeting?'Guide and both residents waited for a deliberate opener for 18 simulation seconds. ':'')+'Sent guide, took a different soldier, walked to the gate by touch, lifted it, returned to command, and both shopkeepers boarded.';
        return;
    }
    if(params.has('column')){
        await button(/^現場方針を決める$/);
        await button(/^店先と停留所の名簿を照合$/);
        await button(/を現場へ$/);
        await wait('Column reported after the prologue',()=>articles().includes('避難隊列'),90000);
        await button(/^避難隊列$/);
        await wait('Market options',()=>articles().includes('軒下から誘導') && articles().includes('表通りで誘導'));
        await button(/^店主の名簿$/);
        if(params.has('local-guide')){
            await button(/^地図で隊列を見る$/);await button(/^閉じる$/);
            if(!articles().includes('次の命令を選ぶ'))await button(/^班への命令$/);
            await button(/^次の命令を選ぶ$/);await button(/^警戒$/);
            for(let i=0;i<2 && articles().includes('畳む');i++)await button(/^畳む$/);
            await pause(800);
            finger('touchstart',7,.5,.5);await wait('Map contact',()=>audit().state.fingers>0);
            finger('touchend',7,.5,.5);await wait('Map release',()=>audit().state.fingers===0);
            // Let the escort walk from the bus to the two residents at the marked position.
            await pause(9500);
            if(!articles().some(k=>k.includes('を直接操作')))await button(/^名簿/);
            await button(/を直接操作$/);
            await wait('Soldier at column',()=>audit().state.mode==='FPS');
            await button(/^作戦手帳$/);await button(/^避難隊列$/);
            await button(/^表通りで誘導$/);await button(/^列を止める$/);await button(/^同行を再開$/);
            if(await capture('near-guide'))return;
            await button(/^閉じる$/);
            if(await capture('near-guide-street'))return;
            log.textContent='PASS '+frame.width+'×'+frame.height+' | Walked from bus to the named market residents, possessed on site, guided, held and resumed the column on foot.';
            return;
        }
        if(await capture('column-roll'))return;
        await button(/^警備班$/);
        await button(/^軒下から誘導$/);
        await button(/^列を止める$/);
        await button(/^同行を再開$/);
        await button(/^横戸を開ける$/);
        await button(/^地図で隊列を見る$/);
        await button(/^閉じる$/);
        await wait('Located column on map',()=>!articles().includes('閉じる'));
        if(!articles().some(k=>k.includes('を直接操作')))await button(/^名簿/);
        await button(/を直接操作$/);
        await wait('Possessed column escort',()=>audit().state.mode==='FPS');
        if(await capture('column-street-fps'))return;
        await button(/^作戦手帳$/);await button(/^避難隊列$/);
        await wait('On-foot roster',()=>articles().includes('隊列の位置を確認'));
        if(await capture('column-fps'))return;
        await button(/^閉じる$/);
        log.textContent='PASS '+frame.width+'×'+frame.height+' | Market column roster, route B escort, hold, resume, side gate, location, possession and on-foot manifest.';
        return;
    }
    if(params.has('wing')){
        await button(/^現場方針を決める$/);
        await button(/^店先と停留所の名簿を照合$/);
        await button(/を現場へ$/);
        await wait('First market incident',()=>articles().includes('青果店前に班を派遣'),90000);
        if(!articles().includes('任務地点へ'))await button(/^班への命令$/);
        await button(/^任務地点へ$/);
        await wait('First rescue order accepted',()=>audit().clicks.includes('任務地点へ'));
        await button(/^青果店前に班を派遣$/);
        await button(/^警備班を派遣$/);
        await wait('Wing unlocked in second sector',()=>articles().includes('館内の救助を指揮'),90000);
        await button(/^館内の救助を指揮$/);
        await wait('Clinic map',()=>articles().includes('配電室') && articles().includes('地域診療所'));
        if(await capture('floor-plan'))return;
        await button(/^配電室$/);
        await button(/^病棟の電源を戻す$/);
        await wait('Squad dispatched',()=>!articles().includes('地域診療所'));
        if(!articles().some(k=>k.includes('を直接操作')))await button(/^名簿/);
        await button(/を直接操作$/);
        await wait('Inhabit wing squad',()=>audit().state.mode==='FPS');
        await button(/^作戦手帳$/);
        await button(/^館内見取図$/);
        await wait('Map from direct view',()=>articles().includes('案内を表示して戻る'));
        if(await capture('floor-plan-fps'))return;
        await button(/^案内を表示して戻る$/);
        log.textContent='PASS '+frame.width+'×'+frame.height+' | Opened clinic through the second market district, selected power room, dispatched squad, possessed soldier and opened floor map on foot.';
        return;
    }
    if(params.has('waypoints')){
        if(!articles().includes('次の命令を選ぶ'))await button(/^班への命令$/);
        await button(/^次の命令を選ぶ$/);
        await button(/^経路を描く$/);
        async function tapGround(x,y){
            finger('touchstart',7,x,y);
            await wait('Map contact',()=>audit().state.fingers>0);
            finger('touchend',7,x,y);
            await wait('Map release',()=>audit().state.fingers===0);
        }
        await tapGround(.44,.43);
        await tapGround(.58,.50);
        await button(/^1点戻す$/);
        await tapGround(.56,.55);
        await button(/^終点で/);
        if(await capture('waypoints'))return;
        await button(/^経路を送信$/);
        await wait('Dispatch closed editor',()=>articles().includes('次の命令を選ぶ'));
        await button(/^次の命令を選ぶ$/);await button(/^経路を描く$/);
        await wait('Squad is following route',()=>articles().includes('経路を解除して待機'));
        await button(/^経路を解除して待機$/);
        await wait('Squad halted',()=>articles().includes('次の命令を選ぶ'));
        log.textContent='PASS '+frame.width+'×'+frame.height+' | Plotted two map stops, undid and replaced a stop, changed final order, dispatched and halted the squad.';
        return;
    }
    if(await capture('command'))return;
    await button(/^現場方針を決める$/);
    await wait('Two distinct opening responses',()=>articles().includes('店先と停留所の名簿を照合') && articles().includes('店主を案内役に迎える'));
    if(await capture('book'))return;
    await button(/^店主を案内役に迎える$/);
    await button(/を現場へ$/);
    await wait('Chapter assignment returned to the map',()=>articles().includes('作戦手帳') && !articles().includes('市街捜索'));
    await button(/^作戦手帳$/);await button(/^市街捜索$/);
    await wait('Witness locations',()=>articles().includes('青果の荷受け台') && articles().includes('商店会の案内板'));
    if(await capture('search'))return;
    await button(/^捜索先$/);
    await wait('Possible rooms',()=>articles().includes('製氷室') && articles().includes('案内室'));
    await button(/^同行・救護$/);
    await wait('Rescue destinations',()=>articles().includes('前方救護所'));
    await button(/^閉じる$/);
    if(!Object.keys(audit().buttons).some(k=>k.includes('を直接操作')))await button(/^名簿/);
    await button(/を直接操作$/);await wait('Direct',()=>audit().state.mode==='FPS');
    if(await capture('direct'))return;
    await button(/^作戦手帳$/);
    await wait('Field book is usable in first person',()=>articles().includes('市街捜索'));
    await button(/^閉じる$/);
    const start={...audit().state};
    finger('touchstart',1,.13,.78);await pause(100);finger('touchmove',1,.17,.63);
    finger('touchstart',2,.64,.49);await pause(90);finger('touchmove',2,.72,.50);
    const trigger=custom?[.77,.68]:[.86,.72];
    finger('touchstart',3,...trigger);await pause(610);
    const after={...audit().state};
    for(const [id,p] of [[1,[.17,.63]],[2,[.72,.50]],[3,trigger]])finger('touchend',id,...p);
    await wait('All three fingers released',()=>audit().state.fingers===0);
    const walked=Math.hypot(after.x-start.x,after.z-start.z);
    if(!(walked>.4 && Math.abs(after.yaw-start.yaw)>1 && after.ammo<start.ammo && audit().maxFingers>=3))
        throw new Error('Concurrent move/look/fire failed. '+JSON.stringify({start,after,maxFingers:audit().maxFingers,walked}));
    await button(/^装填$/);
    await wait('Reload above '+after.ammo+' rounds',()=>audit().state.ammo>after.ammo,8000);
    await button(/^指揮に戻る/);await wait('Return',()=>audit().state.mode==='RTS');
    await button(/^作戦手帳$/);
    await button(/^現場からの要請/);await button(/^引き受ける/);await button(/を現場へ$/);
    await button(/^一時停止/);await wait('Pause',()=>audit().state.phase==='Paused');
    log.textContent='PASS '+frame.width+'×'+frame.height+' | Three simultaneous DOM touch contacts in Unity. '+
        'Movement '+walked.toFixed(2)+' m, yaw '+(after.yaw-start.yaw).toFixed(1)+'°, ammunition '+start.ammo+' → '+after.ammo+
        '. Chapter response, search evidence and escort tabs, FPS field book, reload, RTS return, optional dispatch and pause passed.'+(custom?' Rebinding, reset and repositioned fire control passed.':'');
})().catch(error => {document.querySelector('#results').textContent='FAIL '+error.message;});
</script></html>
