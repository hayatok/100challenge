<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まちあかりマート</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d3d3a;color:#f3ead3;font-family:system-ui}canvas{display:block;width:100%;height:100%;outline:0}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#1d3d3a;gap:12px}h1{font-size:28px;margin:0}p{font-size:14px}progress{width:240px;accent-color:#d2a55d}button{padding:12px;background:#f3ead3;border:2px solid #adbc99;cursor:pointer}</style>$GODOT_HEAD_INCLUDE</head><body><canvas id="canvas" tabindex="0" aria-label="まちあかりマートの店内と経営画面"></canvas><div id="status"><h1>まちあかりマート</h1><p id="message">お店の明かりをつけています。</p><progress id="progress"></progress></div><script src="$GODOT_URL"></script><script>const engine=new Engine($GODOT_CONFIG);const status=document.getElementById('status');const msg=document.getElementById('message');engine.startGame({onProgress:(current,total)=>{const p=document.getElementById('progress');if(total>0){p.max=total;p.value=current;}}}).then(()=>{status.style.display='none';document.getElementById('canvas').focus();}).catch(e=>{msg.textContent='お店を開けませんでした。WebGL 2対応ブラウザで再読み込みしてください。';const b=document.createElement('button');b.textContent='再読み込み';b.onclick=()=>location.reload();status.appendChild(b);console.error(e);});</script></body></html>
