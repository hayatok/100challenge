<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>線路の砦・画面モック</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151a22;color:#fff;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif}main{height:100dvh;display:grid;grid-template-rows:56px minmax(0,1fr) 230px;padding-bottom:env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#171d25;font-size:13px;gap:6px}header span{max-width:65%;font-size:12px;line-height:1.4}header small{max-width:35%;font-size:9px;color:#d7dce3;text-align:right}.scene{position:relative;overflow:hidden;min-height:0}.art{position:absolute;inset:0;background-image:url('../../art/01-rail.png');background-size:300% 100%;background-position:50% 50%}.scene:after{content:'';position:absolute;inset:0;box-shadow:inset 0 -80px 60px -30px #10151aa0;pointer-events:none}.badge{position:absolute;z-index:1;top:12px;left:12px;background:#14202eea;border:1px solid #ffffff70;border-radius:4px;padding:7px 10px;font-size:12px}.select{position:absolute;z-index:2;left:40%;top:48%;width:64px;height:64px;border:3px solid #ffe7a2;border-radius:12px;background:#ffd96724;color:#fff;font-size:12px;box-shadow:0 0 0 7px #161f2970}.panel{padding:14px 16px 12px;background:#f7f2e9;color:#20252c;display:flex;flex-direction:column;gap:8px;min-height:0}h1{margin:0;font-size:17px;line-height:1.4}p{margin:0;font-size:14px;line-height:1.5;min-height:42px}.actions{display:flex;gap:8px;margin-top:auto}button{font:inherit;min-height:46px;border:2px solid #293440;border-radius:5px;background:#fffdf8;color:#20252c;font-size:13px;font-weight:600}.actions button{flex:1;padding:5px}.actions .confirm{background:#B86437;color:white;border-color:#B86437}button:focus-visible{outline:3px solid #116daf;outline-offset:2px}.notice{font-size:10px;color:#5a626c;line-height:1.2}.chosen{background:#d5ad4345;border-color:#fff}@media(max-height:740px){main{grid-template-rows:52px minmax(0,1fr) 226px}.panel{padding:10px 14px}}</style>
<main><header><span>工事点3 / 砲台の弾1</span><small>開発前の画面イメージ</small></header><section class="scene"><div class="art"></div><div class="badge">確定前に結果を確認</div><button class="select" aria-label="対象を選択">選択</button></section><section class="panel"><h1>線路を壁に変える</h1><p id="description">この線路の補給は止まります。砲台は攻撃を防げますが、反撃後の弾は0になります。</p><div class="actions"><button class="">線路を選ぶ</button><button class="confirm">壁に変える</button><button class="">取り消す</button></div><div class="notice">画面構成を確認する見本です。ゲームは進行しません。</div></section></main>
<script>const original="この線路の補給は止まります。砲台は攻撃を防げますが、反撃後の弾は0になります。";const p=document.querySelector('#description');document.querySelectorAll('button').forEach((b)=>b.addEventListener('click',()=>{if(['取り消す','保留する'].includes(b.textContent)){p.textContent=original;document.querySelector('.select')?.classList.remove('chosen')}else if(b.classList.contains('select')){b.classList.toggle('chosen');p.textContent='対象を選びました。下の説明を読んで、実行するか取り消すかを決めてください。'}else{p.textContent='画面の表示例です。選んだ操作：'+b.textContent;}}));</script></html>
