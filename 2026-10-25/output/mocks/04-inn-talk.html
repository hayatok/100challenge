<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>六部屋の約束・画面モック</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151a22;color:#fff;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif}main{height:100dvh;display:grid;grid-template-rows:44px minmax(0,1fr) 195px;padding-bottom:env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#171d25;font-size:13px;gap:6px}header span{white-space:nowrap}header small{font-size:10px;color:#d7dce3}.scene{position:relative;overflow:hidden;min-height:0}.art{position:absolute;inset:0;background-image:url('../../art/04-inn.png');background-size:300% 100%;background-position:100% 50%}.scene:after{content:'';position:absolute;inset:0;box-shadow:inset 0 -80px 60px -30px #10151aa0;pointer-events:none}.badge{position:absolute;z-index:1;top:12px;left:12px;background:#14202eea;border:1px solid #ffffff70;border-radius:4px;padding:7px 10px;font-size:12px}.select{position:absolute;z-index:2;left:40%;top:48%;width:64px;height:64px;border:3px solid #ffe7a2;border-radius:12px;background:#ffd96724;color:#fff;font-size:12px;box-shadow:0 0 0 7px #161f2970}.panel{padding:14px 16px 12px;background:#f7f2e9;color:#20252c;display:flex;flex-direction:column;gap:8px;min-height:0}h1{margin:0;font-size:17px;line-height:1.4}p{margin:0;font-size:14px;line-height:1.5;min-height:42px}.actions{display:flex;gap:8px;margin-top:auto}button{font:inherit;min-height:46px;border:2px solid #293440;border-radius:5px;background:#fffdf8;color:#20252c;font-size:13px;font-weight:600}.actions button{flex:1;padding:5px}.actions .confirm{background:#a75437;color:white;border-color:#a75437}button:focus-visible{outline:3px solid #116daf;outline-offset:2px}.notice{font-size:10px;color:#5a626c;line-height:1.2}.chosen{background:#d5ad4345;border-color:#fff}@media(max-height:740px){main{grid-template-rows:40px minmax(0,1fr) 187px}.panel{padding:10px 14px}}</style>
<main><header><span>帰還後の交流</span><small>企画画面・未実装</small></header><section class="scene"><div class="art"></div><div class="badge">交流ログを任意に開ける</div></section><section class="panel"><h1>マオ</h1><p id="description">閉店後まで支配人でいなくても、いいでしょう？</p><div class="actions"><button class="">返事をする</button><button class="confirm">ログ</button><button class="">設定</button></div><div class="notice">静止画と選択表示のモック。ゲームの進行処理はありません。</div></section></main>
<script>const original="閉店後まで支配人でいなくても、いいでしょう？";const p=document.querySelector('#description');document.querySelectorAll('button').forEach((b)=>b.addEventListener('click',()=>{if(['取消','保留'].includes(b.textContent)){p.textContent=original;document.querySelector('.select')?.classList.remove('chosen')}else if(b.classList.contains('select')){b.classList.toggle('chosen');p.textContent='対象を選択中。下部で影響を読み、確定か取消を選びます。'}else{p.textContent='表示確認用のモックです。選択した操作：'+b.textContent;}}));</script></html>
