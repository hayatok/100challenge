<!doctype html>
<html><head><meta charset="utf-8"><title>Vision asset smoke</title></head>
<body><output id="result">Loading local WASM and model…</output>
<script type="module">
  import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision'
  const result = document.getElementById('result')
  try {
    const start = performance.now()
    const vision = await FilesetResolver.forVisionTasks('/vision/wasm')
    const detector = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: '/vision/hand_landmarker.task', delegate: 'CPU' },
      runningMode: 'VIDEO', numHands: 1,
    })
    const image = new Image()
    image.src = '/tests/hand-landmark-sample.jpg'
    await image.decode()
    const canvas = document.createElement('canvas')
    canvas.width = image.naturalWidth
    canvas.height = image.naturalHeight
    canvas.getContext('2d').drawImage(image, 0, 0)
    const video = document.createElement('video')
    video.muted = true
    video.srcObject = canvas.captureStream(30)
    await video.play()
    const detection = detector.detectForVideo(video, performance.now())
    video.srcObject.getTracks().forEach(track => track.stop())
    const origins = [...new Set(performance.getEntriesByType('resource').map(entry => new URL(entry.name).origin))]
    result.textContent = `READY: local VIDEO model found ${detection.landmarks.length} hand(s), ${detection.landmarks[0]?.length ?? 0} landmarks; init + detection ${Math.round(performance.now() - start)} ms; observed resource origins: ${origins.join(', ')}`
    detector.close()
  } catch (error) {
    result.textContent = `FAILED: ${error.message}`
  }
</script></body></html>
